<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <style>
      :root{
        --bg:#061823;     /* 青み黒 */
        --bg2:#03121b;    /* ちょい暗 */
        --cyan:#18f0ff;   /* シアン */
        --white:#E9FBFF;  /* レーダー線（白） */
      }

      .rim  { fill:none; stroke:var(--cyan); stroke-width:8; stroke-opacity:.85; }
      .grid { fill:none; stroke:var(--cyan); stroke-width:3.5; stroke-opacity:.55; }
      .grid-strong { stroke:var(--cyan); stroke-width:4; stroke-opacity:.80; }
      .dot  { fill:var(--cyan); }
      .dot-ring { fill:none; stroke:var(--cyan); stroke-width:6; stroke-opacity:.75; }
      .sweep{ stroke:var(--white); stroke-width:6; stroke-linecap:round; opacity:.85; }
    </style>

    <!-- ベース円の“ほんの少しだけ”の面の変化（ぼかし無しのグラデ） -->
    <radialGradient id="radarFill" cx="55%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#0a2a3a"/>
      <stop offset="55%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--bg2)"/>
    </radialGradient>

    <!-- ソナー（スイープ線のマイナス側30°: 15°→45°）用グラデーション -->
    <linearGradient id="sonarWedge" gradientUnits="userSpaceOnUse" x1="605.2" y1="164.3" x2="766.6" y2="257.4">
      <stop offset="0%"  stop-color="var(--cyan)" stop-opacity="0"/>
      <stop offset="65%" stop-color="var(--cyan)" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="var(--cyan)" stop-opacity="0.22"/>
    </linearGradient>

    <!-- レーダー内容を円内に収めるためのクリップ -->
    <clipPath id="radarClip">
      <circle cx="512" cy="512" r="360"/>
    </clipPath>
  </defs>

  <!-- Radar group is center-scaled so we don’t have to recompute radii/angles -->
  <g id="radar" transform="translate(512 512) scale(1.0) translate(-512 -512)">
    <!-- 1) ベース円 -->
    <circle id="radar-base" cx="512" cy="512" r="360" fill="url(#radarFill)"/>

    <!-- 2) 外周リム -->
    <circle id="radar-rim"  cx="512" cy="512" r="360" class="rim"/>

    <!-- 3) グリッド（円内限定） -->
    <g id="radar-grid" clip-path="url(#radarClip)">
      <!-- 十字 -->
      <line x1="152" y1="512" x2="872" y2="512" class="grid-strong"/>
      <line x1="512" y1="152" x2="512" y2="872" class="grid-strong"/>

      <!-- 同心円 -->
      <circle cx="512" cy="512" r="120" class="grid"/>
      <circle cx="512" cy="512" r="210" class="grid"/>
      <circle cx="512" cy="512" r="300" class="grid"/>
    </g>

    <!-- 4) ソナー的なグラデーション（スイープ線に追従：線のマイナス側30°） -->
    <g id="radar-sonar" clip-path="url(#radarClip)">
      <!-- 中心(512,512) / 半径360 / 15°→45° の扇形 -->
      <path d="M 512 512 L 605.2 164.3 A 360 360 0 0 1 766.6 257.4 Z" fill="url(#sonarWedge)"/>
    </g>

    <!-- 5) レーダー線（真上=0°、右に+45°） -->
    <!-- 終点 = (512 + 360*sin45, 512 - 360*cos45) = (766.6, 257.4) -->
    <g id="radar-sweep-line" clip-path="url(#radarClip)">
      <line x1="512" y1="512" x2="766.6" y2="257.4" class="sweep"/>
    </g>

    <!-- 6) 中央ドット -->
    <g id="radar-center">
      <circle cx="512" cy="512" r="56" class="dot"/>
      <circle cx="512" cy="512" r="74" class="dot-ring"/>
    </g>

    <!-- 7) ブリップ -->
    <g id="radar-blip" clip-path="url(#radarClip)">
      <circle cx="740" cy="420" r="22" class="dot" opacity="0.95"/>
      <circle cx="740" cy="420" r="34" class="dot" opacity="0.20"/>
    </g>
  </g>

  <!-- ヘッドフォン -->
  <g id="headphones"
    transform="translate(512 512) scale(1.25) translate(-512 -512) matrix(1.024 0 0 1.024 1.2595 0)"
    fill="#ffffff"
    stroke="#000000"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="1">

    <path vector-effect="non-scaling-stroke" d="M 202.691,410.329 C 201.841,410.561 192.062,414.965 191.438,415.587 C 190.890,416.132 188.259,423.865 188.333,424.635 C 188.697,428.428 213.966,651.750 214.470,655.527 C 214.578,656.337 219.732,663.889 220.325,664.451 C 220.933,665.027 229.187,669.890 229.962,670.208 C 230.737,670.527 240.031,672.801 240.864,672.885 C 241.793,672.978 253.893,672.894 254.808,672.706 C 255.672,672.528 265.532,668.259 266.186,667.668 C 266.724,667.182 269.188,660.498 269.122,659.776 C 268.767,655.935 244.062,427.007 243.604,423.178 C 243.521,422.484 240.520,416.713 240.012,416.233 C 239.406,415.661 231.161,410.925 230.364,410.677 C 229.464,410.395 217.188,408.823 216.244,408.811 C 215.321,408.800 203.581,410.086 202.691,410.329 Z" />
    <path vector-effect="non-scaling-stroke" d="M 792.262,409.719 C 791.232,409.540 775.841,409.113 774.800,409.203 C 773.988,409.272 765.331,411.780 764.579,412.093 C 763.929,412.364 758.294,415.752 757.824,416.277 C 757.354,416.803 754.496,422.772 754.412,423.473 C 753.957,427.278 729.384,653.294 729.013,657.109 C 728.934,657.928 730.164,667.158 730.648,667.824 C 731.133,668.493 739.578,672.605 740.386,672.780 C 741.421,673.006 757.257,673.934 758.313,673.846 C 759.220,673.770 770.227,670.618 771.048,670.226 C 771.834,669.851 780.307,663.734 780.874,663.072 C 781.386,662.474 784.830,654.792 784.926,654.010 C 785.395,650.231 810.219,427.272 810.563,423.480 C 810.632,422.709 807.211,415.205 806.592,414.740 C 805.813,414.154 793.221,409.886 792.262,409.719 Z" />
